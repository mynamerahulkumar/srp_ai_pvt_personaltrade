# Half Trend options bot. This file is the only trading configuration.
# Credentials belong in .env, not here.

# ============================================================
# TRADING MODE
# ============================================================

trading_mode: "PAPER"          # PAPER | LIVE | BACKTEST

# ============================================================
# MARKET
# ============================================================

underlying: "SENSEX"           # SENSEX | NIFTY | BANKNIFTY

candle_mode: "NORMAL"          # NORMAL | RENKO

timeframe_minutes: 5           # Confirmed candle size for NORMAL mode. Dhan allows 1, 5, 15, 25, or 60.

polling_seconds: 5             # How often the bot checks price, P&L, and stops. Not the candle size.

# ============================================================
# STRATEGY
# ============================================================

halftrend:
  amplitude: 2                 # Half Trend high/low lookback. The chart default is 2.
  channel_deviation: 2         # Width multiplier applied to ATR/2. The chart default is 2.
  sideways_filter_enabled: true
  sideways_lookback: 3         # Confirmed bars used to judge a flat Half Trend line.
  sideways_tolerance_points: 5 # max(line) - min(line) at or below this is SIDEWAYS.

rsi:
  enabled: true                # false means RSI does not block entries.
  period: 14
  bullish_min: 50              # A call needs RSI at or above this value.
  bearish_max: 50              # A put needs RSI at or below this value.

# ============================================================
# RENKO
# ============================================================

renko:
  brick_size_points: 50        # Index points per completed brick. Used only in RENKO mode.
  entry_confirmation_bricks: 1 # Consecutive qualifying bricks required before an entry.
  exit_confirmation_bricks: 2  # Consecutive opposite-side bricks required before an exit.

# ============================================================
# OPTIONS
# ============================================================

option:
  expiry_mode: "NEAREST"       # NEAREST picks the next Dhan expiry. CONFIGURED uses expiry.
  expiry: ""                   # YYYY-MM-DD. Used only when expiry_mode is CONFIGURED.
  selection_mode: "ATM"        # ATM | ITM | OTM | PREMIUM
  strike_offset: 0             # Strikes away from ATM. ATM must be 0. ITM/OTM treat 0 as 1.
  target_premium: 100          # Used only when selection_mode is PREMIUM.
  premium_tolerance: 20        # Maximum rupee distance from target_premium. No match means no trade.
  lots: 1                      # Quantity is lots times the security-master lot size.

# ============================================================
# ORDER EXECUTION
# ============================================================

execution:
  order_type: "LIMIT"          # LIMIT or MARKET. API MARKET orders follow Dhan's protection rule.
  product_type: "INTRADAY"     # INTRADAY or MARGIN.

# ============================================================
# RISK
# ============================================================

risk:
  tp_sl_mode: "UNDERLYING_POINTS"  # UNDERLYING_POINTS | OPTION_PREMIUM_POINTS
  take_profit:
    enabled: true
    points: 100                # Index points, or premium rupees when mode is OPTION_PREMIUM_POINTS.
  stop_loss:
    enabled: true
    points: 50
  stop_bot_after_tp_sl: true   # Exit the process after a take-profit or stop-loss close.
  max_open_strategies: 1       # This bot holds one option at a time.
  max_orders_per_day: 10       # Cap on successful entries. Exits are still allowed after the cap.
  max_loss_per_day_inr: 500    # Gross algo loss floor in rupees. Hitting it closes the option and stops.
  no_reentry_after_stop_loss: true
  no_reentry_after_max_loss: true
  exit_on_opposite_signal: true

# ============================================================
# SESSION
# ============================================================

timezone: "Asia/Kolkata"
run_mode: "SCHEDULED"          # SCHEDULED uses the window below. CONTINUOUS does not.
start_time: "09:20"            # First time a new entry is allowed when run_mode is SCHEDULED.
stop_time: "15:20"             # After this, new entries stop. Closing follows the flags below.
close_all_positions_at_stop: true
stop_bot_after_close: true

# ============================================================
# MARKET-CLOSE MONITORING
# ============================================================

post_close_polls: 3
post_close_poll_seconds: 10

# ============================================================
# BACKTEST
# ============================================================

backtest:
  start_date: "2026-01-01"
  end_date: "2026-09-30"
