# ============================================================
# DELTA CRYPTO BREAKOUT BOT
# User trading configuration
# ============================================================

# Delta perpetual futures symbol
# Examples: BTCUSD, ETHUSD, SOLUSD, XAUSD, XAUTUSD
symbol: "BTCUSD"

# PAPER = simulated trading
# LIVE  = real trading
mode: "LIVE"

# Leverage requested for the selected futures product
leverage: 25

# Number of contracts/orders for each entry
order_size: 1

# market_order is recommended for the simple default execution
# limit_order can be implemented if fully supported
order_type: "market_order"

# How often the bot polls the exchange
polling_seconds: 5

# Candle timeframe used by the breakout strategy
# Examples: 1m, 3m, 5m, 15m, 30m, 1h, 4h, 1d
timeframe: "1h"

# ------------------------------------------------------------
# RUNNING MODE
# ------------------------------------------------------------

# CONTINUOUS = start immediately and trade while main.py runs
# SCHEDULED  = trade only inside start_time / stop_time
run_mode: "CONTINUOUS"

timezone: "Asia/Kolkata"

# Used only when run_mode = SCHEDULED
start_time: "09:30"
stop_time: "23:00"

# If true, close this strategy's open position at stop_time
close_positions_at_stop_time: false

# After the scheduled position is closed, exit Python
stop_bot_after_close: true

# ------------------------------------------------------------
# BREAKOUT STRATEGY
# ------------------------------------------------------------

strategy:
  enabled: true

  # Completed candles of `timeframe` used for the breakout range.
  # 1 = the previous completed candle (5m = previous 5m bar, 1d = previous day).
  breakout_lookback_candles: 1

  # BREAKOUT = buy a poke above the range, sell a poke below it
  # FADE     = sell a poke above the range, buy a poke below it
  entry: "FADE"

  # LONG, SHORT or BOTH. Filters the order side, not the poked level.
  direction: "BOTH"

# ------------------------------------------------------------
# BREAKOUT CONFIRMATION
# ------------------------------------------------------------

confirmation:
  enabled: true

  # POINTS or PERCENT
  mode: "POINTS"

  # Example: 50 points above/below breakout range
  value: 150

  # true  = wait for a completed candle close beyond the level
  # false = enter when the live price crosses the level
  candle_close_confirmation: false

# ------------------------------------------------------------
# TP / SL
# ------------------------------------------------------------

take_profit:
  enabled: true

  # PNL or PERCENT
  mode: "PNL"

  # PNL = dollars of cash profit after the entry fee and the exit fee
  # PERCENT = percentage from entry price
  value: 1

stop_loss:
  enabled: true

  # PNL or PERCENT
  mode: "PNL"

  # Positive cash loss after the entry fee and the exit fee when mode = PNL
  # Example 2 means the trade loses about $2 including both fees
  value: 2

# Stop after TP/SL exit
stop_after_tp: false
stop_after_sl: false

# ------------------------------------------------------------
# TRADING STYLE
# ------------------------------------------------------------

# true  = enforce scheduled/day-trading behavior
# false = allow the strategy to continue without an artificial
#         intraday restriction
day_trading_enabled: true

# ------------------------------------------------------------
# RISK LIMITS
# ------------------------------------------------------------

max_open_strategies: 1

max_orders_per_day: 2

# If daily strategy loss reaches this amount,
# block new entries and close active strategy position.
# This is exchange cash, so fees already count toward it.
max_loss_per_day_dollar: 3

# Fraction of order value charged on each fill.
# The order log is 0.05% plus 18% GST, which is 0.00059.
# A $1 target is placed far enough that both fills still leave about $1.
fee_rate: 0.00059

# ------------------------------------------------------------
# RE-ENTRY
# ------------------------------------------------------------

# false = do not immediately re-enter after an exit
allow_reentry_after_exit: false
