# ============================================================
# DELTA CRYPTO BREAKOUT BOT
# User trading configuration
# ============================================================

# Delta perpetual futures symbol
# Examples: BTCUSD, ETHUSD, SOLUSD, XAUSD, XAUTUSD
symbol: "BTCUSD"

# PAPER = simulated trading
# LIVE  = real trading
mode: "LIVE"

# Leverage requested for the selected futures product
leverage: 25

# Number of contracts/orders for each entry
order_size: 5

# market_order is recommended for the simple default execution
# limit_order can be implemented if fully supported
order_type: "market_order"

# How often the bot polls price and the open position.
# Candle downloads stay on their own slower cycle.
polling_seconds: 1

# Candle timeframe used by the breakout strategy
# Examples: 1m, 3m, 5m, 15m, 30m, 1h, 4h, 1d
timeframe: "1h"

# ------------------------------------------------------------
# RUNNING MODE
# ------------------------------------------------------------

# CONTINUOUS = start immediately and trade while main.py runs
# SCHEDULED  = new entries only inside start_time / stop_time
run_mode: "CONTINUOUS"

timezone: "Asia/Kolkata"

# Used only when run_mode = SCHEDULED
start_time: "09:30"
stop_time: "23:00"

# If true, close this strategy's open position at stop_time
close_positions_at_stop_time: false

# After a scheduled flatten, exit Python.
# false keeps the process up so the next window can trade.
stop_bot_after_close: false

# ------------------------------------------------------------
# BREAKOUT STRATEGY
# ------------------------------------------------------------

strategy:
  enabled: true

  # Completed candles of `timeframe` used for the breakout range.
  # 1 = the previous completed candle (5m = previous 5m bar, 1d = previous day).
  breakout_lookback_candles: 1

  # LONG, SHORT or BOTH
  direction: "BOTH"

# ------------------------------------------------------------
# BREAKOUT CONFIRMATION
# ------------------------------------------------------------

confirmation:
  enabled: true

  # POINTS or PERCENT
  mode: "POINTS"

  # Example: 50 points above/below breakout range
  value: 150

  # true  = wait for a completed candle close beyond the level
  # false = enter when the live price crosses the level
  candle_close_confirmation: false

# ------------------------------------------------------------
# TP / SL
# ------------------------------------------------------------

take_profit:
  enabled: true

  # PNL or PERCENT
  mode: "PNL"

  # Hard exit. With trailing on, this is the maximum profit, not the first target.
  # PNL = dollars. PERCENT = percentage from entry price.
  value: 10

stop_loss:
  enabled: true

  # PNL or PERCENT
  mode: "PNL"

  # Initial stop. Stays here until the trail activates.
  # Positive dollar amount when mode = PNL. 3 means exit around -$3.
  value: 3

# ------------------------------------------------------------
# TRAILING STOP
# ------------------------------------------------------------

# After best profit reaches activate_profit, the stop moves to
# best profit minus distance and only tightens. It uses the best
# profit, not the latest price. The hard exit remains take_profit.
trailing:
  enabled: true
  activate_profit: 4
  distance: 3

# Stop after TP/SL exit
stop_after_tp: false
stop_after_sl: false

# ------------------------------------------------------------
# TRADING STYLE
# ------------------------------------------------------------

# true  = enforce scheduled/day-trading behavior
# false = allow the strategy to continue without an artificial
#         intraday restriction
day_trading_enabled: true

# ------------------------------------------------------------
# RISK LIMITS
# ------------------------------------------------------------

max_open_strategies: 1

max_orders_per_day: 20

# If today's realized plus open loss reaches this amount, close the open
# trade and block new entries until the next Asia/Kolkata day.
# A +take_profit win closes that trade only and keeps scanning the same day.
max_loss_per_day_dollar: 10

# ------------------------------------------------------------
# RE-ENTRY
# ------------------------------------------------------------

# false = do not immediately re-enter after an exit
allow_reentry_after_exit: false
